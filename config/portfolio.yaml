# FINN demo portfolio: mix of sectors and sizes so alerts + filings look different per stock.
# bse_code is only used when NSE is unreachable (BSE fallback). Verify codes on bseindia.com.

alerts:                  # global thresholds (override per stock below)
  price_move_pct: 4.0    # |daily move| >= 4%
  volume_multiple: 2.0   # volume >= 2x 20-day average
  volume_lookback: 20
  sigma_threshold: 3.0   # move >= 3 std-devs of the stock's own daily moves; null to disable
  sigma_lookback: 60
  min_avg_volume: 0

portfolio:
  # --- large caps ---
  - {symbol: RELIANCE,   bse_code: 500325, name: Reliance Industries,  sector: Energy & Conglomerate}
  - {symbol: HDFCBANK,   bse_code: 500180, name: HDFC Bank,            sector: Private Bank}
  - {symbol: INFY,       bse_code: 500209, name: Infosys,              sector: IT Services}
  - {symbol: ITC,        bse_code: 500875, name: ITC,                  sector: FMCG}
  - {symbol: BHARTIARTL, bse_code: 532454, name: Bharti Airtel,        sector: Telecom}
  - {symbol: LT,         bse_code: 500510, name: Larsen & Toubro,      sector: Capital Goods}
  - {symbol: SUNPHARMA,  bse_code: 524715, name: Sun Pharma,           sector: Pharma}
